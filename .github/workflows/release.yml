name: Build and publish LipatoS Statuses
on:
  push:
    branches: [main]
    paths:
      - module.json
      - scripts/**
      - styles/**
      - README.md
      - CHANGELOG.md
      - tests/**
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          node --check scripts/main.js
          node -e 'const m=require("./module.json"); if(m.id!=="lipatos-status-automation"||m.version!=="2.0.0")process.exit(1);'
          node tests/smoke.cjs
      - name: Build
        run: zip -q -r lipatos-status-automation.zip module.json scripts styles README.md CHANGELOG.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'require("./module.json").version')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" lipatos-status-automation.zip module.json --clobber
          else
            gh release create "$TAG" lipatos-status-automation.zip module.json \
              --target "$GITHUB_SHA" \
              --title "LipatoS — Статусы $TAG" \
              --notes "Foundry VTT 14 / D&D5e 6.0.5. Статусы только для чтения у игроков, подсказки правил, полный контроль ГМ."
          fi
